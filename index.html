 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Day Weather Forecast</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #222;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .day {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
        }

        .weather-icon {
            font-size: 45px;
            margin: 10px 0;
        }

        .condition {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .temperature {
            font-size: 18px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            margin: 30px;
        }

        .error {
            text-align: center;
            color: red;
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>7-Day Weather Forecast</h1>

    <div id="loading" class="loading">
        Loading forecast...
    </div>

    <div id="forecast" class="forecast"></div>

    <div id="error" class="error"></div>


    <script>

        // --------------------------------
        // LOCATION
        // --------------------------------

        // Replace these with your location coordinates
        const latitude = 22.5958;
        const longitude = 88.2636;


        // --------------------------------
        // WEATHER CODE → ICON
        // --------------------------------

        function getWeatherEmoji(code) {

            if (code === 0)
                return "☀️";

            if (code === 1)
                return "🌤️";

            if (code === 2)
                return "⛅";

            if (code === 3)
                return "☁️";

            if (code === 45 || code === 48)
                return "🌫️";

            if (code >= 51 && code <= 55)
                return "🌦️";

            if (code >= 56 && code <= 57)
                return "🌧️";

            if (code >= 61 && code <= 65)
                return "🌧️";

            if (code >= 66 && code <= 67)
                return "🌧️";

            if (code >= 71 && code <= 77)
                return "❄️";

            if (code >= 80 && code <= 82)
                return "🌦️";

            if (code >= 85 && code <= 86)
                return "🌨️";

            if (code >= 95)
                return "⛈️";

            return "🌤️";
        }


        // --------------------------------
        // WEATHER CODE → DESCRIPTION
        // --------------------------------

        function getWeatherDescription(code) {

            if (code === 0)
                return "Clear sky";

            if (code === 1)
                return "Mainly clear";

            if (code === 2)
                return "Partly cloudy";

            if (code === 3)
                return "Overcast";

            if (code === 45 || code === 48)
                return "Fog";

            if (code >= 51 && code <= 55)
                return "Drizzle";

            if (code >= 56 && code <= 57)
                return "Freezing drizzle";

            if (code >= 61 && code <= 65)
                return "Rain";

            if (code >= 66 && code <= 67)
                return "Freezing rain";

            if (code >= 71 && code <= 77)
                return "Snow";

            if (code >= 80 && code <= 82)
                return "Rain showers";

            if (code >= 85 && code <= 86)
                return "Snow showers";

            if (code >= 95)
                return "Thunderstorm";

            return "Unknown";
        }


        // --------------------------------
        // GET DAY NAME
        // --------------------------------

        function getDayName(dateString) {

            const date = new Date(dateString + "T12:00:00");

            return date.toLocaleDateString("en-US", {
                weekday: "long"
            });
        }


        // --------------------------------
        // FORMAT DATE
        // --------------------------------

        function formatDate(dateString) {

            const date = new Date(dateString + "T12:00:00");

            return date.toLocaleDateString("en-US", {
                day: "numeric",
                month: "short"
            });
        }


        // --------------------------------
        // LOAD WEATHER
        // --------------------------------

        async function loadWeather() {

            const loading = document.getElementById("loading");
            const forecastContainer =
                document.getElementById("forecast");
            const error =
                document.getElementById("error");

            try {

                const url =
                    `https://api.open-meteo.com/v1/forecast` +
                    `?latitude=${latitude}` +
                    `&longitude=${longitude}` +
                    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
                    `&timezone=auto`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Weather API error");
                }

                const data = await response.json();

                loading.style.display = "none";

                const dates = data.daily.time;
                const weatherCodes = data.daily.weather_code;
                const maxTemps = data.daily.temperature_2m_max;
                const minTemps = data.daily.temperature_2m_min;


                // --------------------------------
                // IMPORTANT:
                // START FROM TOMORROW
                // --------------------------------

                forecastContainer.innerHTML = "";


                // index 0 = TODAY
                // index 1 = TOMORROW
                //
                // Therefore we start at 1
                // and show the next 7 days.

                for (let i = 1; i <= 7; i++) {

                    const date = dates[i];
                    const code = weatherCodes[i];

                    const dayName = getDayName(date);
                    const formattedDate = formatDate(date);

                    const icon = getWeatherEmoji(code);

                    const description =
                        getWeatherDescription(code);

                    const maxTemp =
                        Math.round(maxTemps[i]);

                    const minTemp =
                        Math.round(minTemps[i]);


                    // --------------------------------
                    // CREATE CARD
                    // --------------------------------

                    const card =
                        document.createElement("div");

                    card.className = "card";

                    card.innerHTML = `

                        <div class="day">
                            ${dayName}
                        </div>

                        <div class="date">
                            ${formattedDate}
                        </div>

                        <div class="weather-icon">
                            ${icon}
                        </div>

                        <div class="condition">
                            ${description}
                        </div>

                        <div class="temperature">
                            ${maxTemp}°C / ${minTemp}°C
                        </div>

                    `;

                    forecastContainer.appendChild(card);
                }

            }

            catch (err) {

                loading.style.display = "none";

                error.innerHTML =
                    "Unable to load weather data.";

                console.error(err);
            }
        }


        // --------------------------------
        // START
        // --------------------------------

        loadWeather();

    </script>

</body>
</html>
